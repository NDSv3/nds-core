# Read the Docs configuration, see https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen

# conf.py runs Doxygen before Sphinx reads the sources
sphinx:
  configuration: doc/sphinx/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: doc/sphinx/requirements.txt
